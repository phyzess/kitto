# DSH 自动压缩参考配置（Kitto 参考文件，不会自动部署）
#
# 触发公式（dsh-compaction-basic）：
#   压缩触发 = min(thresholdRatio × contextWindow, contextWindow − maxTokens − headroomTokens)
# 默认 thresholdRatio 0.8、headroomTokens 65536；contextWindow 和 maxTokens 来自模型路由。
#
# 问题：contextWindow 按模型的真实容量配成 1.05M，触发点因此被推到 ~840K。
# 2026-11-19~24 实测：会话正好顶到 840.5K，44% 的请求落在 >200K 的翻倍档，
# 5 天折算约 $850，而日志里只有 compaction/prune（工具结果剪枝），没有摘要压缩。
#
# 推荐改法（不动 preset）：把 llm-pi-ai 里模型的 contextWindow 降到有效预算。
#   gpt-6.2-sol / gpt-6.2-astra:
#     contextWindow: 400000
#     maxTokens: 128000
#   → min(0.8 × 400K, 400K − 128K − 65.5K) ≈ 206K
#   低于 OpenAI 的 272K 翻倍档与 Grok 的 200K 翻倍档。
#
# 为什么不改 preset：
#   Web 不创建也不编辑 preset（配置查看器是只读的）；PresetDefinition 没有继承字段；
#   按行 id 覆盖内置 preset 会整表替换（实测 354 → 322 个节点，standard 的 30 个插件
#   全丢）。要改阈值只能整份冻结 plugins，代价是 DSH 升级后新插件被静默遮蔽。
#   改 contextWindow 只有一行，跟着模型路由走，升级不受影响。
#
# 生效与验证：
#   1. 重启 web profile（配置在会话启动时快照）；
#   2. node ~/.agents/skills/context-budget/scripts/dsh-usage.mjs --days 1
#      单请求 prompt 的 p90 应从 500K+ 回落到 200K 附近；日志出现压缩事件而非只有 prune；
#   3. Web 的 Context 面板能看到压缩事件的下降标记。
#
# 取舍：压缩越早越省钱，但摘要会丢细节、可能带来重读。200K 附近是折中点；
# 只读核查这类长循环更适合本地聚合成一份材料，不靠压缩兜底。
