# DSH 自动压缩参考配置（Kitto 参考文件，不会自动部署）
#
# 为什么需要它：DSH 的 compaction-basic 默认 thresholdRatio = 0.8（上下文窗口的
# 80%）。对 1M 窗口的模型，压缩要到 ~840K prompt 才触发——2026-11-19~24 的实测里，
# 会话正好涨到 840.5K，44% 的请求落在 >200K 的翻倍档，5 天折算约 $850。
# 会话里只有 compaction/prune（工具结果剪枝），没有任何摘要压缩事件。
#
# 目标值（按 150K 量级触发，压缩后保留 ~32K 近期上下文）：
#   auto: true
#   thresholdRatio: 0.15
#   retainTokens: 32000
#   maxTokens: 8192
#
# 改法一（推荐）：Web → Settings → Agent presets → standard → compaction-basic，
# 填上面四个值。保存后重启 profile，新会话生效。
#
# 改法二（脚本化）：profile patch 里对 preset-standard 只写部分 plugins 会整表替换
# （实测 354 → 322 个节点），必须整份覆盖 config.plugins。要用这种方式，先导出：
#   dsh --dump-config --profile web > /tmp/tree.yml
# 取 `- id: preset-standard` 到下一个 preset 之前的整段，改 compaction-basic 的
# config，再整体写进 ~/.dsh/profiles/web/cordis.patch.yml。DSH 升级后要重新生成。
#
# 等价片段（仅示意嵌套位置，不能单独照抄）：
# - id: preset-standard
#   config:
#     plugins:
#       - id: compaction
#         config:
#           - id: compaction-basic
#             config:
#               auto: true
#               thresholdRatio: 0.15
#               retainTokens: 32000
#               maxTokens: 8192
#
# 生效验证：
#   1. 新开一个会话，跑十几步后看日志里出现 compaction 摘要事件（旧会话只有 prune）；
#   2. node ~/.agents/skills/context-budget/scripts/dsh-usage.mjs --days 1
#      看单请求 prompt 的 p90 从 500K+ 回落到 200K 以下；
#   3. Web 的 Context 面板看压缩事件标记。
#
# 取舍：压缩越早，单请求越便宜，但摘要会丢细节、可能增加重读。150–200K 触发、
# 保留 30K 左右是折中点；只读核查这类长循环更适合直接改成本地聚合，不靠压缩兜底。
