# DSH AgentTeams 编排模板（Kitto 参考文件，不会自动部署）
#
# 合并到 ~/.dsh/profiles/web/cordis.patch.yml，然后重启 web profile。
# Kitto 只管理 AGENTS.md 与 skills；DSH 的 profile 配置由本机原生维护，
# 这份文件是跨机器复用的源。
#
# 顺序：
# 1. 先配置 Grok 路由（推荐用「设置 → 模型 → 添加模型提供商 → 自定义模型 API」，
#    由界面校验后写入；下表是同样的配置，便于新机器手工合并）。
# 2. 再把 - id: agent-teams 条目合并进去。同 id 覆盖会替换整个 config，
#    必须保留 stateDir 与 memberProvider。
# 3. 重启 web profile 后，在聊天里用 /agent-teams --profile dev-standard <目标>，
#    或让队长调用 agent_teams_create({ profile: "dev-standard", approval: "required" })。
#
# 注意：toolPolicies 是工具可见性，不是 OS 沙箱；bash 仍可在允许后写文件。
# 两个订阅渠道：GPT（openai-codex）承担方案与实现，opencode-go 承担验证与审查。
# Grok 只出现在 dev-hard 的 reviewer（T2 审查），走 opencode-go 而不是 xAI 官方计费；
# dev-standard 的审查用 Kimi K3.1 Pro，与 GPT 实现跨家族。
# opencode-go 不可用时，核实查与验证按 fallback 用 GPT 档，队长在报告里注明「同家族复核」。
# 第三意见按需用 agent_teams_add_member 临时加入。

# --- 1. Grok 路由：追加到现有 - id: llm-pi-ai 的 providers 下，不要整段覆盖 ---
#   xai:  # 不使用：xAI 官方渠道按量计费
#     displayName: xAI
#     apiKeyEnv: XAI_API_KEY
#     api: openai-completions
#     baseURL: https://api.x.ai/v1
#     compat:
#       supportsDeveloperRole: false
#     models:
#       - id: grok-4.7
#         name: Grok 4.7
#         contextWindow: 524288
#         input: [text, image]
#         reasoningEfforts:
#           low: low
#           medium: medium
#           high: high
#           xhigh: xhigh

# --- 2. 团队模板 ---
- id: agent-teams
  config:
    stateDir: .agent-teams
    memberProvider: spawn
    memberMaxDepth: 0
    maxMembers: 8
    fallback:
      provider: openai-codex
      model: gpt-6.2-sol
    toolPolicies:
      read-only:
        allow: [read, glob, grep, bash, web_search, web_fetch]
    profiles:
      dev-standard:
        description: T1 标准开发：Sol 实现，Luna 验证，Kimi 审查
        taskPlanning: captain
        members:
          - name: implementer
            role: 实现
            provider: openai-codex
            model: gpt-6.2-sol
            reasoning_effort: high
          - name: verifier
            role: 验证
            provider: opencode-go
            model: gpt-6-luna
            reasoning_effort: medium
          - name: reviewer
            role: 审查
            provider: opencode-go
            model: kimi-k3.1-pro
            reasoning_effort: high
            tool_policy: read-only
        reviewPolicy:
          codeMaxRounds: 2
          maxRepairAttempts: 2
          requiredReviewers: [reviewer]
      dev-hard:
        description: T2 攻坚：Astra 方案，Sol 实现/长跑，Grok 审查，Luna 验证
        taskPlanning: captain
        members:
          - name: architect
            role: 方案
            provider: openai-codex
            model: gpt-6.2-astra
            reasoning_effort: high
            tool_policy: read-only
          - name: implementer
            role: 实现
            provider: openai-codex
            model: gpt-6.2-sol
            reasoning_effort: high
          - name: longrun
            role: 长跑
            provider: openai-codex
            model: gpt-6.2-sol
            reasoning_effort: high
          - name: verifier
            role: 验证
            provider: opencode-go
            model: gpt-6-luna
            reasoning_effort: medium
          - name: reviewer
            role: 审查
            provider: opencode-go
            model: grok-4.7
            reasoning_effort: high
            tool_policy: read-only
            fallback:
              provider: opencode-go
              model: kimi-k3.1-pro
        reviewPolicy:
          requirementsMinRounds: 1
          requirementsMaxRounds: 2
          codeMaxRounds: 3
          maxRepairAttempts: 3
          requiredReviewers: [reviewer]
