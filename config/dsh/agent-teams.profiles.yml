- id: agent-teams
  config:
    stateDir: .agent-teams
    memberProvider: spawn
    memberMaxDepth: 0
    maxMembers: 8
    toolPolicies:
      read-only:
        allow: [read, glob, grep, bash, web_search, web_fetch]
    profiles:
      dev-standard:
        description: T1 标准开发：Sol 实现，DeepSeek Flash 验证，GLM-5.3 审查，DeepSeek Flash 按需批量
        taskPlanning: captain
        protocol: Teams 不受 Kitto 执行门禁保护；审批前逐个离线预检，核实所有继承层的有效 fallback、账号、额度及精确档位，不能确认就停派。
        members:
          - name: implementer
            role: 实现
            provider: openai-codex
            model: gpt-6.2-sol
          - name: batch
            role: 批量与扫描（按需）
            provider: opencode-go
            model: deepseek-v4.1-flash
          - name: verifier
            role: 验证
            provider: opencode-go
            model: deepseek-v4.1-flash
          - name: reviewer
            role: 审查
            provider: opencode-go
            model: glm-5.3
            tool_policy: read-only
        reviewPolicy:
          codeMaxRounds: 2
          maxRepairAttempts: 2
          requiredReviewers: [reviewer]
      dev-hard:
        description: T2 攻坚参考：按任务预检选路，确认独立审查和 Native fallback 已关闭
        taskPlanning: captain
        protocol: Teams 不受 Kitto 执行门禁保护；审批前逐个离线预检，核实所有继承层的有效 fallback、账号、额度及精确档位，不能确认就停派。
        members:
          - name: architect
            role: 方案
            provider: openai-codex
            model: gpt-6.2-sol
            tool_policy: read-only
          - name: implementer
            role: 实现
            provider: openai-codex
            model: gpt-6.2-sol
          - name: longrun
            role: 长跑
            provider: openai-codex
            model: gpt-6.2-sol
          - name: batch
            role: 批量与扫描（按需）
            provider: opencode-go
            model: deepseek-v4.1-flash
          - name: verifier
            role: 验证
            provider: opencode-go
            model: deepseek-v4.1-flash
          - name: reviewer
            role: 审查
            provider: opencode-go
            model: glm-5.3
            tool_policy: read-only
        reviewPolicy:
          requirementsMinRounds: 1
          requirementsMaxRounds: 2
          codeMaxRounds: 2
          maxRepairAttempts: 2
          requiredReviewers: [reviewer]
