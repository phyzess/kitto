

- id: agent-teams
  config:
    stateDir: .agent-teams
    memberProvider: spawn
    memberMaxDepth: 0
    maxMembers: 8
    fallback:
      provider: openai-codex
      model: gpt-6.2-sol
    toolPolicies:
      read-only:
        allow: [read, glob, grep, bash, web_search, web_fetch]
    profiles:
      dev-standard:
        description: T1 标准开发：Sol 实现，Luna 验证，Kimi 审查
        taskPlanning: captain
        members:
          - name: implementer
            role: 实现
            provider: openai-codex
            model: gpt-6.2-sol
            reasoning_effort: high
          - name: verifier
            role: 验证
            provider: opencode-go
            model: gpt-6-luna
            reasoning_effort: medium
          - name: reviewer
            role: 审查
            provider: opencode-go
            model: kimi-k3.1-pro
            reasoning_effort: high
            tool_policy: read-only
        reviewPolicy:
          codeMaxRounds: 2
          maxRepairAttempts: 2
          requiredReviewers: [reviewer]
      dev-hard:
        description: T2 攻坚：Astra 方案，Sol 实现/长跑，Grok 审查，Luna 验证
        taskPlanning: captain
        members:
          - name: architect
            role: 方案
            provider: openai-codex
            model: gpt-6.2-astra
            reasoning_effort: high
            tool_policy: read-only
          - name: implementer
            role: 实现
            provider: openai-codex
            model: gpt-6.2-sol
            reasoning_effort: high
          - name: longrun
            role: 长跑
            provider: openai-codex
            model: gpt-6.2-sol
            reasoning_effort: high
          - name: verifier
            role: 验证
            provider: opencode-go
            model: gpt-6-luna
            reasoning_effort: medium
          - name: reviewer
            role: 审查
            provider: opencode-go
            model: grok-4.7
            reasoning_effort: high
            tool_policy: read-only
            fallback:
              provider: opencode-go
              model: kimi-k3.1-pro
        reviewPolicy:
          requirementsMinRounds: 1
          requirementsMaxRounds: 2
          codeMaxRounds: 3
          maxRepairAttempts: 3
          requiredReviewers: [reviewer]
