name: Configuration checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6.0.3
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.node-version'
      - run: bash -n setup.sh && bash -n sync.sh
      - run: python -m unittest discover -s tests -v
      - run: npm test
      - name: Install validated native hosts
        run: |
          node --input-type=module <<'JS'
          import { execFileSync } from 'node:child_process';
          import { hosts, pnpmVersion } from './lib/kitto.mjs';
          execFileSync('npm', ['install', '--prefix', process.env.RUNNER_TEMP + '/kitto-hosts', '--no-audit', '--no-fund', '--ignore-scripts', 'pnpm@' + pnpmVersion, ...Object.values(hosts).map(host => host.package + '@' + host.version)], { stdio: 'inherit' });
          // pnpm 12 needs its own installer to replace the shell placeholder
          // with a native executable on macOS; other package scripts stay off.
          execFileSync('npm', ['rebuild', '--prefix', process.env.RUNNER_TEMP + '/kitto-hosts', 'pnpm'], { stdio: 'inherit' });
          JS
      - name: Verify native lifecycle without model credentials
        env:
          KITTO_NATIVE_BIN: ${{ runner.temp }}/kitto-hosts/node_modules/.bin
        run: node --test tests/native.test.mjs
      - name: Verify workspace sessions with native Codex and DSH
        run: |
          export PATH="$RUNNER_TEMP/kitto-hosts/node_modules/.bin:$PATH"
          node --test tests/scope-codex.test.mjs tests/scope-dsh.test.mjs
