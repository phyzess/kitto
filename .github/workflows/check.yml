name: Configuration checks
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  test:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.node-version'
      - name: Check comment ratchet or report required bootstrap review
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ && "$BASE_SHA" != 0000000000000000000000000000000000000000 ]]
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          args=(--base "$BASE_SHA" --head "$HEAD_SHA")
          if [[ -n "$PR_HEAD_SHA" ]]; then args+=(--pr-head "$PR_HEAD_SHA"); fi
          if [[ "$BASE_SHA" == 4400a587ef93343ec6c5c52d20b7dc8e8468638c ]]; then
            printf '%s\n' '::warning::No trusted comment ratchet ran for the first rollout. Protected independent maintainer review of the exact candidate is required before merge.'
            exit 0
          fi
          tool="$(mktemp -d "$RUNNER_TEMP/kitto-comments.XXXXXX")"
          cleanup() { test -n "$tool" && rm -rf -- "$tool"; }
          trap cleanup EXIT
          git archive "$BASE_SHA" package.json package-lock.json scripts/check-comments.mjs scripts/comment-ratchet.mjs scripts/comment-ratchet | tar -x -C "$tool"
          npm ci --ignore-scripts --prefix "$tool"
          node "$tool/scripts/check-comments.mjs" "${args[@]}"
      - run: bash -n setup.sh && bash -n sync.sh
      - run: python -m unittest discover -s tests -v
      - run: npm ci --ignore-scripts
      - run: node --test tests/comment-ratchet.test.mjs
      - run: npm test
      - name: Install validated native hosts
        run: node scripts/ci-install-native.mjs
      - name: Verify native lifecycle without model credentials
        env:
          KITTO_NATIVE_BIN: ${{ runner.temp }}/kitto-hosts/node_modules/.bin
        run: node --test tests/native.test.mjs
      - name: Verify workspace sessions with native Codex and DSH
        run: |
          export PATH="$RUNNER_TEMP/kitto-hosts/node_modules/.bin:$PATH"
          node --test tests/scope-codex.test.mjs tests/scope-dsh.test.mjs
