name: Configuration checks
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  test:
    name: unit (${{ matrix.os }})
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.node-version'
      - name: Check comment ratchet or report required bootstrap review
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          valid_sha() { [[ "$1" =~ ^[0-9a-f]{40}$ && "$1" != 0000000000000000000000000000000000000000 ]]; }
          valid_sha "$BASE_SHA"
          valid_sha "$HEAD_SHA"
          test "$(git --no-replace-objects rev-parse --verify HEAD)" = "$HEAD_SHA"
          test "$(git --no-replace-objects cat-file -t "$BASE_SHA")" = commit
          args=(--base "$BASE_SHA" --head "$HEAD_SHA")
          case "$GITHUB_EVENT_NAME" in
            pull_request)
              valid_sha "$PR_HEAD_SHA"
              test "$(git --no-replace-objects cat-file -t "$PR_HEAD_SHA")" = commit
              test "$(git --no-replace-objects show --no-patch --format=%P "$HEAD_SHA")" = "$BASE_SHA $PR_HEAD_SHA"
              args+=(--pr-head "$PR_HEAD_SHA")
              ;;
            push) [[ "$GITHUB_REF" == refs/heads/main && -z "$PR_HEAD_SHA" ]] || exit 1 ;;
            *) exit 1 ;;
          esac
          tool="$(mktemp -d "$RUNNER_TEMP/kitto-comments.XXXXXX")"
          cleanup() { test -n "$tool" && rm -rf -- "$tool"; }
          trap cleanup EXIT
          git --no-replace-objects archive "$BASE_SHA" package.json package-lock.json scripts/check-comments.mjs scripts/comment-ratchet.mjs scripts/comment-ratchet | tar -x -C "$tool"
          npm ci --ignore-scripts --prefix "$tool"
          node "$tool/scripts/check-comments.mjs" "${args[@]}"
      - name: Use a symlinked temporary directory
        shell: bash
        run: |
          mkdir "$RUNNER_TEMP/real-tmp"
          ln -s "$RUNNER_TEMP/real-tmp" "$RUNNER_TEMP/link-tmp"
          echo "TMPDIR=$RUNNER_TEMP/link-tmp" >> "$GITHUB_ENV"
      - run: bash -n setup.sh
      - run: python3 -m unittest discover -s tests -v
      - run: npm ci --ignore-scripts
      - run: npm run check:test-wiring
      - run: npm run lint:versions
      - run: npm run lint:invariants
      - run: npm run typecheck
      - run: npm run lint:ox
      - run: npm run build
      - run: node scripts/check-dist-determinism.mjs
      - run: npm test
  native:
    name: native (hosts, ${{ matrix.os }})
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        id: node
        with:
          node-version-file: '.node-version'
      - name: Use a symlinked temporary directory
        shell: bash
        run: |
          mkdir "$RUNNER_TEMP/real-tmp"
          ln -s "$RUNNER_TEMP/real-tmp" "$RUNNER_TEMP/link-tmp"
          echo "TMPDIR=$RUNNER_TEMP/link-tmp" >> "$GITHUB_ENV"
      - run: npm ci --ignore-scripts
      - name: Build the package that the hosts load
        run: npm run build
      - name: Restore validated native hosts
        id: hosts
        uses: actions/cache@v6.1.0
        with:
          path: ${{ runner.temp }}/kitto-hosts
          key: kitto-hosts-${{ runner.os }}-${{ runner.arch }}-node${{ steps.node.outputs.node-version }}-${{ hashFiles('lib/host-pins.mjs', 'scripts/ci-install-native.mjs') }}
      - name: Install validated native hosts
        if: steps.hosts.outputs.cache-hit != 'true'
        run: node scripts/ci-install-native.mjs
      - name: Verify native host versions
        run: node scripts/ci-install-native.mjs --verify-only
      - name: Verify native lifecycle without model credentials
        env:
          KITTO_NATIVE_BIN: ${{ runner.temp }}/kitto-hosts/node_modules/.bin
          KITTO_TEST_PACKAGE_ROOT: ${{ github.workspace }}/dist
        run: npx vp test run tests/native.test.mjs
      - name: Verify workspace sessions with native Codex and DSH
        env:
          KITTO_TEST_PACKAGE_ROOT: ${{ github.workspace }}/dist
        run: |
          export PATH="$RUNNER_TEMP/kitto-hosts/node_modules/.bin:$PATH"
          npx vp test run tests/scope-codex.test.mjs tests/scope-dsh.test.mjs
  native-routing:
    name: Verify native DSH Web routing
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.node-version'
      - run: npm ci --ignore-scripts
      - name: Install exact DSH and run credential-free routing fixtures
        shell: bash
        run: |
          routing_version="$(node scripts/print-host-pin.mjs routing)"
          scratch="$(mktemp -d "${RUNNER_TEMP:?}/kitto-dsh-routing.XXXXXX")"
          mkdir "$scratch/home"
          env -i PATH="$PATH" HOME="$scratch/home" npm install --prefix "$scratch" --ignore-scripts --no-audit --no-fund @deepseek-ai/dsh@"$routing_version"
          install="$scratch/node_modules/@deepseek-ai/dsh"
          env -i PATH="$PATH" HOME="$scratch/home" KITTO_TEST_DSH_INSTALL="$install" npx vp test run tests/dsh-routing.test.mjs
